name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Also run Compose UI tests on an Android TV emulator (slow)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Output is also saved to build.log so errors can be summarised below.
      # Release only: it is the one to install (the debug build is slow on a TV), and building a
      # second APK and running lint added minutes for nothing.
      - name: Build release APK (optimised)
        run: ./gradlew assembleRelease --console=plain 2>&1 | tee -a build.log

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-control-center-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # After the APK, so a failing test never keeps you from installing. A red mark here still
      # means something is worth a look; the details are in the reports download.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Show Kotlin and Hilt errors
        if: failure()
        run: |
          {
            echo '### Compile errors'
            echo '```'
            grep -E '^(e: |error: |.*\[Hilt\]|.*\[ksp\])' build.log | sed 's#file://##' | head -80
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build.log
            app/build/reports/tests/
          if-no-files-found: ignore

  ui-tests:
    name: Compose UI tests (Android TV emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
